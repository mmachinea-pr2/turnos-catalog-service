spring.application.name=turnos-catalog-service
server.address=${APP_HOST:127.0.0.1}
server.port=${APP_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=false

# Los instantes de auditoría se persisten en UTC; los horarios son locales.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Consulta REST opcional; no realiza solicitudes durante el arranque.
catalog.catedra.enabled=${CATEDRA_REST_ENABLED:false}
catalog.catedra.base-url=${CATEDRA_API_BASE_URL:}
catalog.catedra.jwt=${CATEDRA_JWT:}
catalog.catedra.connect-timeout=${CATEDRA_CONNECT_TIMEOUT:5s}
catalog.catedra.read-timeout=${CATEDRA_READ_TIMEOUT:10s}
