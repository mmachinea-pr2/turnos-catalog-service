name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas y Sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar código e historial
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ejecutar pruebas y generar cobertura
        run: ./mvnw -B -ntp clean verify

      - name: Comprobar informe JaCoCo
        run: test -s target/site/jacoco/jacoco.xml

      - name: Enviar análisis y cobertura a Sonar
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Falta el secreto SONAR_TOKEN del repositorio.'
            exit 1
          fi
          ./mvnw -B -ntp sonar:sonar -Dsonar.qualitygate.wait=true
